type Query {
  vehicleMakes(limit: Int, page: Int): [VehicleMakeBasic]
  vehicleMake(makeId: ID!): VehicleMakeDetailed
}

type MakeType {
  makeId: Int!
  typeId: Int!
  typeName: String
  # vehicle_make_id: Int!
}

type VehicleMakeBasic {
  makeId: Int!
  makeName: String!
}

type VehicleMakeDetailed {
  makeId: Int!
  makeName: String!
  vehicleTypes: [MakeType]
}